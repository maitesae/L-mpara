<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Aquí hay luz</title>
  <meta name="description" content="Una lámpara interactiva minimalista y cálida para iluminar la noche." />
  <meta property="og:title" content="Aquí hay luz" />
  <meta property="og:description" content="Una lámpara interactiva minimalista y cálida para iluminar la noche." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#070b14" />
  <style>
    :root {
      --bg-night: #070b14;
      --transition-lamp: 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      --serif: "Palatino Linotype", "Book Antiqua", Palatino, "Iowan Old Style", Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-night);
      color: #e8ecf4;
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Main nocturnal scene */
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      place-items: center;
      background-color: var(--bg-night);
      background-image: radial-gradient(
        circle at 50% 52%,
        rgba(14, 21, 38, 0.52) 0%,
        rgba(7, 11, 20, 0.94) 58%,
        #04070d 100%
      );
      overflow: hidden;
      isolation: isolate;
      padding:
        max(22px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
    }

    /* Starfield layer (~70 twinkling stars) */
    .sky-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      transition: opacity var(--transition-lamp);
    }

    body.lamp-on .sky-layer {
      opacity: 0.72;
    }

    .bg-star {
      position: absolute;
      border-radius: 50%;
      background-color: var(--star-color, #e9f0ff);
      box-shadow: 0 0 var(--star-glow, 4px) rgba(226, 238, 255, 0.45);
      opacity: var(--min-op, 0.22);
      will-change: opacity, transform;
      animation: twinkle var(--twinkle-dur, 4.5s) ease-in-out var(--twinkle-delay, 0s) infinite;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: var(--min-op, 0.2);
        transform: scale(0.88);
      }
      50% {
        opacity: var(--max-op, 0.85);
        transform: scale(1.12);
      }
    }

    /* Subtle shooting star every 6 seconds */
    .shooting-star {
      position: fixed;
      top: 0;
      left: 0;
      width: 110px;
      height: 1.5px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        rgba(255, 250, 235, 0) 0%,
        rgba(220, 232, 255, 0.35) 55%,
        rgba(255, 248, 232, 0.95) 100%
      );
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transform-origin: right center;
      will-change: transform, opacity;
    }

    .shooting-star::after {
      content: "";
      position: absolute;
      right: -1px;
      top: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      transform: translateY(-50%);
      background: #fffdf5;
      box-shadow: 0 0 8px 2px rgba(255, 242, 206, 0.85);
    }

    .shooting-star.active {
      animation: shootAcross 1.35s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }

    @keyframes shootAcross {
      0% {
        opacity: 0;
        transform: translate3d(var(--sx, 12vw), var(--sy, 14vh), 0) rotate(var(--srot, 24deg)) scaleX(0.3);
      }
      16% {
        opacity: 0.92;
        transform: translate3d(
          calc(var(--sx, 12vw) + var(--sdx, 26vw) * 0.22),
          calc(var(--sy, 14vh) + var(--sdy, 16vh) * 0.22),
          0
        ) rotate(var(--srot, 24deg)) scaleX(1);
      }
      72% {
        opacity: 0.68;
      }
      100% {
        opacity: 0;
        transform: translate3d(
          calc(var(--sx, 12vw) + var(--sdx, 26vw)),
          calc(var(--sy, 14vh) + var(--sdy, 16vh)),
          0
        ) rotate(var(--srot, 24deg)) scaleX(0.75);
      }
    }

    /* Warm radial ambient glow spanning the screen when lamp is ON */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity var(--transition-lamp);
      background:
        radial-gradient(
          circle at 50% 48%,
          rgba(255, 232, 175, 0.44) 0%,
          rgba(247, 193, 108, 0.28) 18%,
          rgba(222, 146, 66, 0.16) 38%,
          rgba(145, 86, 40, 0.08) 58%,
          rgba(7, 11, 20, 0) 82%
        );
    }

    .ambient-glow-wide {
      position: fixed;
      inset: -10%;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transform: scale(0.92);
      transition:
        opacity var(--transition-lamp),
        transform var(--transition-lamp);
      background:
        radial-gradient(
          ellipse 78% 72% at 50% 50%,
          rgba(255, 214, 138, 0.17) 0%,
          rgba(205, 132, 62, 0.09) 42%,
          rgba(60, 42, 34, 0.04) 70%,
          transparent 92%
        );
    }

    body.lamp-on .ambient-glow {
      opacity: 1;
    }

    body.lamp-on .ambient-glow-wide {
      opacity: 1;
      transform: scale(1);
    }

    /* Floating warm light particles when lamp is ON */
    .particles-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity var(--transition-lamp);
      overflow: hidden;
    }

    body.lamp-on .particles-layer {
      opacity: 1;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 248, 224, 0.95) 0%,
        rgba(255, 218, 142, 0.55) 45%,
        rgba(255, 190, 92, 0) 100%
      );
      will-change: transform, opacity;
      animation: floatMote var(--dur, 12s) ease-in-out var(--delay, 0s) infinite;
    }

    @keyframes floatMote {
      0% {
        transform: translate3d(0, 14px, 0) scale(0.75);
        opacity: 0;
      }
      18% {
        opacity: var(--max-op, 0.65);
      }
      50% {
        transform: translate3d(var(--drift-x, 16px), var(--drift-y, -48px), 0) scale(1.08);
        opacity: calc(var(--max-op, 0.65) * 0.9);
      }
      82% {
        opacity: var(--max-op, 0.65);
      }
      100% {
        transform: translate3d(var(--drift-x2, -10px), var(--drift-y2, -104px), 0) scale(0.7);
        opacity: 0;
      }
    }

    /* 4 interactive glowing stars distributed in the sky */
    .interactive-stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .star-btn {
      position: absolute;
      pointer-events: auto;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: none;
      min-width: 48px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      touch-action: manipulation;
      outline: none;
      color: #fff6dc;
      transform: translate(-50%, -50%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .star-btn::before {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 232, 174, 0.44) 0%,
        rgba(255, 214, 134, 0.12) 55%,
        rgba(255, 214, 134, 0) 75%
      );
      animation: starHaloPulse var(--pulse-dur, 3.2s) ease-in-out var(--pulse-delay, 0s) infinite;
      pointer-events: none;
    }

    .star-btn svg {
      position: relative;
      width: 17px;
      height: 17px;
      display: block;
      filter: drop-shadow(0 0 6px rgba(255, 232, 174, 0.85));
      animation: starIconPulse var(--pulse-dur, 3.2s) ease-in-out var(--pulse-delay, 0s) infinite;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .star-btn:hover svg,
    .star-btn:focus-visible svg {
      transform: scale(1.24);
      filter: drop-shadow(0 0 11px rgba(255, 240, 195, 1));
    }

    .star-btn:active {
      transform: translate(-50%, -50%) scale(0.92);
    }

    .star-btn:focus-visible {
      box-shadow: 0 0 0 1.5px rgba(255, 230, 170, 0.55);
    }

    .star-btn.tapped::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(255, 236, 188, 0.72);
      animation: starRipple 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: none;
    }

    @keyframes starHaloPulse {
      0%, 100% {
        transform: scale(0.84);
        opacity: 0.42;
      }
      50% {
        transform: scale(1.32);
        opacity: 0.92;
      }
    }

    @keyframes starIconPulse {
      0%, 100% {
        opacity: 0.74;
        transform: scale(0.93);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }

    @keyframes starRipple {
      0% {
        transform: scale(0.7);
        opacity: 0.85;
      }
      100% {
        transform: scale(2.8);
        opacity: 0;
      }
    }

    /* Positions for the 4 interactive stars (safe from lamp, messages & hidden corner) */
    .star-pos-1 {
      left: 15%;
      top: 18%;
      --pulse-dur: 3.1s;
      --pulse-delay: 0s;
    }

    .star-pos-2 {
      left: 85%;
      top: 21%;
      --pulse-dur: 3.6s;
      --pulse-delay: -1.1s;
    }

    .star-pos-3 {
      left: 16%;
      top: 76%;
      --pulse-dur: 3.4s;
      --pulse-delay: -2.2s;
    }

    .star-pos-4 {
      left: 83%;
      top: 72%;
      --pulse-dur: 3.8s;
      --pulse-delay: -0.7s;
    }

    @media (max-width: 600px) {
      .star-pos-1 {
        left: 14%;
        top: 11%;
      }
      .star-pos-2 {
        left: 86%;
        top: 13%;
      }
      .star-pos-3 {
        left: 15%;
        top: 81%;
      }
      .star-pos-4 {
        left: 84%;
        top: 77%;
      }
    }

    /* Soft light bubble for interactive star messages (auto-fades after 4s) */
    .star-bubble {
      position: fixed;
      z-index: 15;
      max-width: min(260px, calc(100vw - 32px));
      padding: 11px 18px;
      border-radius: 999px;
      background: linear-gradient(
        145deg,
        rgba(48, 39, 32, 0.82) 0%,
        rgba(24, 22, 32, 0.86) 100%
      );
      border: 1px solid rgba(255, 226, 166, 0.34);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.45),
        0 0 24px rgba(255, 214, 134, 0.24),
        inset 0 1px 0 rgba(255, 245, 218, 0.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-family: var(--serif);
      font-size: clamp(0.95rem, 2.8vw, 1.06rem);
      font-style: italic;
      letter-spacing: 0.015em;
      line-height: 1.35;
      color: #fdf2dc;
      text-align: center;
      text-shadow: 0 0 14px rgba(255, 212, 130, 0.35);
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-50%, -8px, 0) scale(0.94);
      transition:
        opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .star-bubble.visible {
      opacity: 1;
      transform: translate3d(-50%, 0, 0) scale(1);
    }

    /* Upper poetic messages when lamp is ON */
    .message-zone {
      grid-row: 1;
      align-self: end;
      z-index: 4;
      width: 100%;
      max-width: 560px;
      padding: 0 12px clamp(16px, 4vh, 40px);
      text-align: center;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .light-message {
      font-family: var(--serif);
      font-size: clamp(1.36rem, 3.8vw, 2.05rem);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.02em;
      line-height: 1.35;
      color: #faedd2;
      text-wrap: balance;
      text-shadow:
        0 0 26px rgba(255, 212, 132, 0.48),
        0 2px 12px rgba(7, 11, 20, 0.65);
      opacity: 0;
      transform: translate3d(0, 10px, 0);
      transition:
        opacity var(--transition-lamp),
        transform var(--transition-lamp);
    }

    .light-subtitle {
      font-family: var(--serif);
      font-size: clamp(0.95rem, 2.7vw, 1.18rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.45;
      color: rgba(247, 224, 182, 0.86);
      text-wrap: balance;
      text-shadow:
        0 0 18px rgba(255, 206, 122, 0.34),
        0 1px 8px rgba(7, 11, 20, 0.6);
      opacity: 0;
      transform: translate3d(0, 12px, 0);
      transition:
        opacity var(--transition-lamp) 0.08s,
        transform var(--transition-lamp) 0.08s;
    }

    body.lamp-on .light-message,
    body.lamp-on .light-subtitle {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    /* Center lamp stage */
    .lamp-stage {
      grid-row: 2;
      position: relative;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Subtle tabletop grounding line */
    .table-horizon {
      position: absolute;
      bottom: 8px;
      width: clamp(220px, 56vw, 440px);
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(148, 163, 194, 0.1) 25%,
        rgba(148, 163, 194, 0.16) 50%,
        rgba(148, 163, 194, 0.1) 75%,
        transparent 100%
      );
      pointer-events: none;
      transition: opacity var(--transition-lamp);
    }

    .table-horizon-lit {
      position: absolute;
      bottom: 8px;
      width: clamp(260px, 64vw, 520px);
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(248, 208, 134, 0.12) 20%,
        rgba(255, 224, 160, 0.34) 50%,
        rgba(248, 208, 134, 0.12) 80%,
        transparent 100%
      );
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-lamp);
    }

    body.lamp-on .table-horizon {
      opacity: 0;
    }

    body.lamp-on .table-horizon-lit {
      opacity: 1;
    }

    /* Interactive lamp button */
    .lamp-button {
      position: relative;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: none;
      padding: 8px 18px 0;
      cursor: pointer;
      touch-action: manipulation;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lamp-button:hover {
      transform: translateY(-1px);
    }

    .lamp-button:active {
      transform: scale(0.985);
    }

    .lamp-button:focus-visible {
      box-shadow: 0 0 0 2px rgba(247, 212, 142, 0.45);
    }

    .lamp-svg {
      width: clamp(205px, 50vw, 285px);
      height: auto;
      display: block;
      overflow: visible;
    }

    /* Smooth 0.8s cross-fade for illuminated SVG layers */
    .lit-layer {
      opacity: 0;
      transition: opacity var(--transition-lamp);
    }

    body.lamp-on .lit-layer {
      opacity: 1;
    }

    .unlit-layer {
      opacity: 1;
      transition: opacity var(--transition-lamp);
    }

    body.lamp-on .unlit-layer {
      opacity: 0.15;
    }

    /* Tactile pull cord animation */
    .pull-cord-group {
      transform-origin: 186px 158px;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .pull-cord-group.pulled {
      transform: translateY(10px);
    }

    /* Subtle breathing glow on the shade halo when lit */
    .shade-outer-halo {
      transform-origin: 150px 108px;
      opacity: 0;
      transform: scale(0.9);
      transition:
        opacity var(--transition-lamp),
        transform var(--transition-lamp);
    }

    body.lamp-on .shade-outer-halo {
      opacity: 1;
      transform: scale(1);
      animation: warmBreath 5.5s ease-in-out 0.8s infinite;
    }

    @keyframes warmBreath {
      0%, 100% {
        transform: scale(1);
        opacity: 0.94;
      }
      50% {
        transform: scale(1.045);
        opacity: 1;
      }
    }

    /* Bottom prompt below lamp */
    .hint-zone {
      grid-row: 3;
      align-self: start;
      z-index: 4;
      padding-top: clamp(18px, 3.8vh, 36px);
      text-align: center;
      pointer-events: none;
    }

    .lamp-hint {
      font-family: var(--sans);
      font-size: clamp(0.84rem, 2.3vw, 0.94rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      color: rgba(162, 174, 198, 0.56);
      transition:
        opacity var(--transition-lamp),
        transform var(--transition-lamp);
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    body.lamp-on .lamp-hint {
      opacity: 0;
      transform: translate3d(0, 4px, 0);
    }

    /* Hidden discreet crescent moon button in bottom-right corner */
    .secret-trigger {
      position: fixed;
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 10;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      touch-action: manipulation;
      outline: none;
      color: rgba(196, 208, 232, 0.22);
      transition:
        color 0.35s ease,
        transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
        filter 0.35s ease;
    }

    body.lamp-on .secret-trigger {
      color: rgba(246, 214, 152, 0.3);
    }

    .secret-trigger svg {
      width: 16px;
      height: 16px;
      display: block;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .secret-trigger:hover,
    .secret-trigger:focus-visible,
    .secret-trigger:active {
      color: rgba(255, 234, 184, 0.92);
      filter: drop-shadow(0 0 8px rgba(255, 216, 138, 0.65));
    }

    .secret-trigger:hover svg,
    .secret-trigger:focus-visible svg {
      transform: scale(1.16) rotate(-8deg);
    }

    .secret-trigger:active svg {
      transform: scale(0.94);
    }

    .secret-trigger:focus-visible {
      box-shadow: 0 0 0 1.5px rgba(255, 224, 160, 0.45);
    }

    /* Secret message modal backdrop & warm translucent card */
    .secret-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(5, 8, 15, 0.58);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
        visibility 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .secret-backdrop.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .secret-card {
      position: relative;
      width: 100%;
      max-width: 340px;
      padding: 42px 32px 38px;
      border-radius: 22px;
      text-align: center;
      background: linear-gradient(
        155deg,
        rgba(46, 35, 28, 0.8) 0%,
        rgba(23, 19, 25, 0.86) 100%
      );
      border: 1px solid rgba(248, 212, 144, 0.28);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.56),
        0 0 44px rgba(244, 186, 98, 0.14),
        inset 0 1px 0 rgba(255, 238, 198, 0.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transform: translate3d(0, 14px, 0) scale(0.96);
      opacity: 0;
      transition:
        transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .secret-backdrop.open .secret-card {
      transform: translate3d(0, 0, 0) scale(1);
      opacity: 1;
    }

    .secret-close {
      position: absolute;
      top: 6px;
      right: 6px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 50%;
      color: rgba(244, 224, 188, 0.52);
      font-family: var(--sans);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      outline: none;
      transition:
        color 0.2s ease,
        background-color 0.2s ease,
        transform 0.2s ease;
    }

    .secret-close:hover,
    .secret-close:focus-visible {
      color: rgba(255, 240, 210, 0.96);
      background-color: rgba(255, 224, 165, 0.08);
    }

    .secret-close:active {
      transform: scale(0.92);
    }

    .secret-close:focus-visible {
      box-shadow: 0 0 0 1.5px rgba(255, 224, 160, 0.45);
    }

    .secret-moon-accent {
      width: 18px;
      height: 18px;
      margin: 0 auto 14px;
      color: rgba(248, 214, 146, 0.76);
      display: block;
    }

    .secret-text {
      font-family: var(--serif);
      font-size: clamp(1.45rem, 4.4vw, 1.75rem);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.02em;
      line-height: 1.35;
      color: #fbf0da;
      text-shadow: 0 0 22px rgba(255, 208, 126, 0.34);
    }

    /* Compact landscape adjustments */
    @media (max-height: 540px) {
      .lamp-svg {
        width: clamp(145px, 28vh, 200px);
      }
      .message-zone {
        padding-bottom: 10px;
        gap: 4px;
      }
      .hint-zone {
        padding-top: 10px;
      }
    }

    /* Respect reduced motion preferences */
    @media (prefers-reduced-motion: reduce) {
      .bg-star,
      .particle,
      .star-btn::before,
      .star-btn svg {
        animation: none;
      }
      .bg-star {
        opacity: var(--max-op, 0.55);
      }
      .particle {
        opacity: var(--max-op, 0.45);
      }
      body.lamp-on .shade-outer-halo {
        animation: none;
      }
      .shooting-star {
        display: none;
      }
      .light-message,
      .light-subtitle,
      .lamp-hint,
      .secret-card {
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <!-- Starry night sky (~70 twinkling stars) -->
    <div class="sky-layer" id="skyLayer" aria-hidden="true"></div>

    <!-- Subtle shooting star every 6 seconds -->
    <div class="shooting-star" id="shootingStar" aria-hidden="true"></div>

    <!-- Atmospheric warm light layers when lamp is ON -->
    <div class="ambient-glow-wide" aria-hidden="true"></div>
    <div class="ambient-glow" aria-hidden="true"></div>

    <!-- Floating warm light particles -->
    <div class="particles-layer" id="particlesLayer" aria-hidden="true"></div>

    <!-- 4 interactive pulsing stars -->
    <div class="interactive-stars" aria-label="Estrellas interactivas">
      <button

          <path d="M12 1.8 C12.8 7.5, 16.5 11.2, 22.2 12 C16.5 12.8, 12.8 16.5, 12 22.2 C11.2 16.5, 7.5 12.8, 1.8 12 C7.5 11.2, 11.2 7.5, 12 1.8 Z" />
        </svg>
      </button>

      <button

        data-message="Eres muy valiente"
        aria-label="Estrella brillante 2"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 1.8 C12.8 7.5, 16.5 11.2, 22.2 12 C16.5 12.8, 12.8 16.5, 12 22.2 C11.2 16.5, 7.5 12.8, 1.8 12 C7.5 11.2, 11.2 7.5, 12 1.8 Z" />
        </svg>
      </button>

      <button
        type="button"
        class="star-btn star-pos-3"
        data-message="Aquí estoy para abrazarte"
        aria-label="Estrella brillante 3"
      >

          <path d="M12 1.8 C12.8 7.5, 16.5 11.2, 22.2 12 C16.5 12.8, 12.8 16.5, 12 22.2 C11.2 16.5, 7.5 12.8, 1.8 12 C7.5 11.2, 11.2 7.5, 12 1.8 Z" />
        </svg>
      </button>

      <button
        type="button"
        class="star-btn star-pos-4"
        data-message="Te amo"
        aria-label="Estrella brillante 4"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 1.8 C12.8 7.5, 16.5 11.2, 22.2 12 C16.5 12.8, 12.8 16.5, 12 22.2 C11.2 16.5, 7.5 12.8, 1.8 12 C7.5 11.2, 11.2 7.5, 12 1.8 Z" />
        </svg>
      </button>
    </div>

    <!-- Soft floating light bubble for star messages -->
    <div class="star-bubble" id="starBubble" role="status" aria-live="polite"></div>

    <!-- Upper illuminated fixed main message + rotating subtitle -->
    <div class="message-zone" aria-live="polite">
      <p class="light-message" id="lightMessage">No tengas miedo, aquí hay luz</p>
      <p class="light-subtitle" id="lightSubtitle">Te amo muchísimo, Renato</p>
    </div>

    <!-- Center cozy SVG table lamp -->
    <div class="lamp-stage">
      <div class="table-horizon" aria-hidden="true"></div>
      <div class="table-horizon-lit" aria-hidden="true"></div>

      <button
        type="button"
        class="lamp-button"
        id="lampButton"
        aria-pressed="false"
        aria-label="Encender o apagar la lámpara"
      >
        <svg
          class="lamp-svg"
          viewBox="0 0 300 320"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          role="img"

          <defs>
            <!-- Radial halo right behind the shade when lit -->
            <radialGradient id="shadeHalo" cx="50%" cy="48%" r="50%">
              <stop offset="0%" stop-color="#fff4cf" stop-opacity="0.72" />
              <stop offset="38%" stop-color="#f7be63" stop-opacity="0.34" />

              <stop offset="100%" stop-color="#d88435" stop-opacity="0" />

            <!-- Soft light cone spilling downward beneath the shade -->
            <linearGradient id="lightCone" x1="150" y1="155" x2="150" y2="306" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffe7ad" stop-opacity="0.52" />
              <stop offset="48%" stop-color="#f5ba62" stop-opacity="0.18" />
              <stop offset="100%" stop-color="#e39642" stop-opacity="0" />
            </linearGradient>

            <!-- Table warm pool of light -->
            <radialGradient id="tablePool" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffd990" stop-opacity="0.42" />
              <stop offset="55%" stop-color="#e8a14c" stop-opacity="0.14" />
              <stop offset="100%" stop-color="#e8a14c" stop-opacity="0" />

            <!-- Unlit shade gradient (deep twilight fabric) -->
            <linearGradient id="shadeOffGrad" x1="88" y1="52" x2="216" y2="162" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#27314a" />

            <!-- Lit shade gradient (warm cream & golden honey) -->

            <!-- Lit inner opening glow -->

            <!-- Unlit ceramic base -->
            <linearGradient id="baseOffGrad" x1="112" y1="205" x2="190" y2="296" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#252e44" />
              <stop offset="50%" stop-color="#181f30" />

            <!-- Lit ceramic base warm glow -->

            <!-- Brass neck unlit -->
            <linearGradient id="brassOff" x1="142" y1="158" x2="158" y2="215" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#4a484c" />
              <stop offset="50%" stop-color="#65605f" />

            <!-- Brass neck lit -->
            <linearGradient id="brassOn" x1="142" y1="158" x2="158" y2="215" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#fff0c6" />
              <stop offset="45%" stop-color="#dfaf64" />
              <stop offset="100%" stop-color="#9d6d35" />
            </linearGradient>

            <!-- Soft Gaussian blur for inner glow elements -->
            <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="10" />
            </filter>
          </defs>

          <!-- Ambient SVG halo around the lamp shade (lit only) -->
          <circle
            class="shade-outer-halo"
            cx="150"
            cy="112"
            r="128"
            fill="url(#shadeHalo)"
          />

          <!-- Downward light cone under the shade (lit only) -->
          <path
            class="lit-layer"
            d="M84 156 L216 156 L268 302 L32 302 Z"

          />

          <!-- Table ground shadow -->
          <ellipse cx="150" cy="300" rx="68" ry="10" fill="#03050a" opacity="0.76" />

          <!-- Warm light pool on table surface (lit only) -->
          <ellipse
            class="lit-layer"
            cx="150"
            cy="300"
            rx="118"
            ry="18"
            fill="url(#tablePool)"
          />

          <!-- Subtle dark inner shadow under shade opening (unlit) -->
          <ellipse cx="150" cy="158" rx="68" ry="12" fill="#0b0f1b" />

          <!-- Warm inner glow inside shade opening (lit) -->
          <ellipse
            class="lit-layer"
            cx="150"
            cy="158"
            rx="66"
            ry="11"
            fill="url(#innerRimOn)"
          />

          <!-- Soft bulb center peeking warmly under the shade (lit) -->
          <g class="lit-layer">
            <ellipse cx="150" cy="156" rx="14" ry="8" fill="#fffdf6" filter="url(#softGlow)" />
            <path d="M142 154 C142 162, 158 162, 158 154 Z" fill="#fffaf0" opacity="0.95" />
          </g>

          <!-- Pull-chain cord & teardrop bead -->
          <g class="pull-cord-group" id="pullCord">
            <line

              y1="158"
              x2="186"
              y2="206"
              stroke="#5b6172"

            />
            <line
              class="lit-layer"
              x1="186"
              y1="158"
              x2="186"
              y2="206"
              stroke="#ebd09a"
              stroke-width="1.6"
              stroke-linecap="round"
            />
            <path
              d="M186 205 C182.2 209.5, 181.5 215.2, 186 216.8 C190.5 215.2, 189.8 209.5, 186 205 Z"

            />
            <path

          <!-- Stem / neck (unlit & lit) -->

            <rect x="145" y="158" width="10" height="50" rx="3" fill="url(#brassOff)" />

              <ellipse

            <!-- Brass foot ring -->
            <path

            <path

          <!-- Top decorative brass finial -->
          <g>
            <path d="M145 56 C145 48, 155 48, 155 56 Z" fill="#4f4b4d" />

            <g class="lit-layer">

          <!-- Cozy rounded dome lampshade (unlit) -->
          <g>
            <path

    <!-- Subtle hint below the lamp -->
    <div class="hint-zone">
      <p class="lamp-hint" id="lampHint">Toca la lámpara, Renato</p>

    <!-- Discreet hidden crescent moon button in bottom-right corner -->
    <button
      type="button"
      class="secret-trigger"
      id="secretTrigger"
      aria-label="Abrir mensaje escondido"
      aria-haspopup="dialog"
      aria-expanded="false"
    >
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

    <!-- Warm translucent special message card -->

      class="secret-backdrop"
      id="secretBackdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="secretText"
      aria-hidden="true"
    >

          type="button"
          class="secret-close"
          id="secretClose"
          aria-label="Cerrar mensaje"

          &times;

          viewBox="0 0 24 24"

        <p class="secret-text" id="secretText">Yo estoy contigo</p>

  </main>

  <script>
    (function () {
      'use strict';

      var body = document.body;
      var skyLayer = document.getElementById('skyLayer');
      var shootingStar = document.getElementById('shootingStar');
      var particlesLayer = document.getElementById('particlesLayer');
      var lampButton = document.getElementById('lampButton');
      var pullCord = document.getElementById('pullCord');
      var lightSubtitle = document.getElementById('lightSubtitle');
      var starBubble = document.getElementById('starBubble');
      var starButtons = document.querySelectorAll('.star-btn');

      var secretTrigger = document.getElementById('secretTrigger');
      var secretBackdrop = document.getElementById('secretBackdrop');
      var secretClose = document.getElementById('secretClose');

      var rotatingSubtitles = [
        'Te amo muchísimo, Renato',
        'Aunque todo esté oscuro, nunca estás solo',
        'Respira tranquilo, yo te cuido',
        'Siempre voy a estar a tu lado'
      ];

      var isLampOn = false;
      var subtitleIndex = 0;
      var cordTimer = null;
      var bubbleTimer = null;
      var shootingTimer = null;

      // 1. Generate ~70 gently twinkling stars across the deep night sky
      function createStarfield() {
        var count = 72;
        var colors = ['#ffffff', '#eef4ff', '#d8e6ff', '#fff4dc', '#e4ecff'];
        var fragment = document.createDocumentFragment();

        for (var i = 0; i < count; i++) {
          var star = document.createElement('span');
          star.className = 'bg-star';

          var x = (Math.random() * 98 + 1).toFixed(2);
          var y = (Math.random() * 96 + 1).toFixed(2);
          var size = (0.9 + Math.random() * 1.9).toFixed(1);
          var minOp = (0.12 + Math.random() * 0.24).toFixed(2);
          var maxOp = (0.55 + Math.random() * 0.42).toFixed(2);
          var dur = (2.8 + Math.random() * 5.2).toFixed(2);
          var delay = (-Math.random() * 7).toFixed(2);
          var color = colors[i % colors.length];
          var glow = (Number(size) * 2.1).toFixed(1);

          star.style.left = x + '%';
          star.style.top = y + '%';
          star.style.width = size + 'px';
          star.style.height = size + 'px';
          star.style.setProperty('--min-op', minOp);
          star.style.setProperty('--max-op', maxOp);
          star.style.setProperty('--twinkle-dur', dur + 's');
          star.style.setProperty('--twinkle-delay', delay + 's');
          star.style.setProperty('--star-color', color);
          star.style.setProperty('--star-glow', glow + 'px');

          fragment.appendChild(star);
        }

        skyLayer.appendChild(fragment);
      }

      // 2. Subtle shooting star crossing the sky every 6 seconds
      function triggerShootingStar() {
        var startX = (8 + Math.random() * 52).toFixed(1) + 'vw';
        var startY = (6 + Math.random() * 24).toFixed(1) + 'vh';
        var deltaX = (24 + Math.random() * 20).toFixed(1) + 'vw';
        var deltaY = (11 + Math.random() * 12).toFixed(1) + 'vh';
        var angle = (18 + Math.random() * 12).toFixed(1) + 'deg';

        shootingStar.classList.remove('active');
        shootingStar.style.setProperty('--sx', startX);
        shootingStar.style.setProperty('--sy', startY);
        shootingStar.style.setProperty('--sdx', deltaX);
        shootingStar.style.setProperty('--sdy', deltaY);
        shootingStar.style.setProperty('--srot', angle);

        // Force reflow to restart animation reliably
        void shootingStar.offsetWidth;
        shootingStar.classList.add('active');
      }

      function startShootingStars() {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          return;
        }
        shootingTimer = setInterval(triggerShootingStar, 6000);
      }

      // 3. Generate floating warm light particles around the lamp halo
      function createParticles() {
        var count = 24;
        var fragment = document.createDocumentFragment();

        for (var i = 0; i < count; i++) {
          var mote = document.createElement('span');
          mote.className = 'particle';

          var angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
          var radiusX = 6 + Math.random() * 34;
          var radiusY = 6 + Math.random() * 28;
          var left = 50 + Math.cos(angle) * radiusX;
          var top = 50 + Math.sin(angle) * radiusY;

          var size = (2.2 + Math.random() * 4.2).toFixed(1);
          var duration = (9 + Math.random() * 9).toFixed(1);
          var delay = (-Math.random() * 14).toFixed(1);
          var maxOpacity = (0.28 + Math.random() * 0.52).toFixed(2);
          var driftX = ((Math.random() - 0.5) * 34).toFixed(1) + 'px';
          var driftX2 = ((Math.random() - 0.5) * 44).toFixed(1) + 'px';
          var driftY = (-30 - Math.random() * 38).toFixed(1) + 'px';
          var driftY2 = (-75 - Math.random() * 65).toFixed(1) + 'px';

          mote.style.width = size + 'px';
          mote.style.height = size + 'px';
          mote.style.left = left.toFixed(2) + '%';
          mote.style.top = top.toFixed(2) + '%';
          mote.style.setProperty('--dur', duration + 's');
          mote.style.setProperty('--delay', delay + 's');
          mote.style.setProperty('--max-op', maxOpacity);
          mote.style.setProperty('--drift-x', driftX);
          mote.style.setProperty('--drift-x2', driftX2);
          mote.style.setProperty('--drift-y', driftY);
          mote.style.setProperty('--drift-y2', driftY2);

          fragment.appendChild(mote);
        }

        particlesLayer.appendChild(fragment);
      }

      // 4. Lamp toggle with rotating subtitle on every turn-on
      function toggleLamp() {
        isLampOn = !isLampOn;

        if (isLampOn) {
          lightSubtitle.textContent = rotatingSubtitles[subtitleIndex];
          subtitleIndex = (subtitleIndex + 1) % rotatingSubtitles.length;
        }

        body.classList.toggle('lamp-on', isLampOn);
        lampButton.setAttribute('aria-pressed', String(isLampOn));

        if (cordTimer) {
          clearTimeout(cordTimer);
        }
        pullCord.classList.add('pulled');
        cordTimer = setTimeout(function () {
          pullCord.classList.remove('pulled');
        }, 210);
      }

      // 5. Interactive star bubble (positioned safely near tapped star, disappears after 4s)
      function showStarMessage(button) {
        var message = button.getAttribute('data-message');
        if (!message) {
          return;
        }

        // Visual ripple feedback on tapped star
        button.classList.remove('tapped');
        void button.offsetWidth;
        button.classList.add('tapped');

        var rect = button.getBoundingClientRect();
        var vw = window.innerWidth;
        var vh = window.innerHeight;

        starBubble.textContent = message;

        // Measure approximate width safely within viewport bounds
        var maxHalfWidth = Math.min(130, (vw - 32) / 2);
        var centerX = rect.left + rect.width / 2;
        var clampedX = Math.max(maxHalfWidth + 16, Math.min(vw - maxHalfWidth - 16, centerX));

        // Place below top stars, above bottom stars
        var isUpperHalf = rect.top < vh * 0.5;
        var posY = isUpperHalf ? rect.bottom + 10 : rect.top - 56;
        posY = Math.max(16, Math.min(vh - 64, posY));

        starBubble.style.left = clampedX.toFixed(1) + 'px';
        starBubble.style.top = posY.toFixed(1) + 'px';

        if (bubbleTimer) {
          clearTimeout(bubbleTimer);
        }

        starBubble.classList.remove('visible');
        void starBubble.offsetWidth;
        starBubble.classList.add('visible');

        bubbleTimer = setTimeout(function () {
          starBubble.classList.remove('visible');
        }, 4000);
      }

      for (var s = 0; s < starButtons.length; s++) {
        (function (btn) {
          btn.addEventListener('click', function () {
            showStarMessage(btn);
          });
        })(starButtons[s]);
      }

      // 6. Hidden bottom-right crescent moon secret card
      function openSecretModal() {
        secretBackdrop.classList.add('open');
        secretBackdrop.setAttribute('aria-hidden', 'false');
        secretTrigger.setAttribute('aria-expanded', 'true');
        secretClose.focus();
      }

      function closeSecretModal() {
        secretBackdrop.classList.remove('open');
        secretBackdrop.setAttribute('aria-hidden', 'true');
        secretTrigger.setAttribute('aria-expanded', 'false');
        secretTrigger.focus();
      }

      lampButton.addEventListener('click', toggleLamp);
      secretTrigger.addEventListener('click', openSecretModal);
      secretClose.addEventListener('click', closeSecretModal);

      secretBackdrop.addEventListener('click', function (event) {
        if (event.target === secretBackdrop) {
          closeSecretModal();
        }
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && secretBackdrop.classList.contains('open')) {
          closeSecretModal();
        }
      });

      window.addEventListener('beforeunload', function () {
        if (shootingTimer) {
          clearInterval(shootingTimer);
        }
      });

      createStarfield();
      createParticles();
      startShootingStars();
    })();
  </script>
</body>
</html>
